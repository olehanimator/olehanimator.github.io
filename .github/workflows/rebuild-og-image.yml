name: Rebuild social preview image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/og-image.svg'
      - '.github/workflows/rebuild-og-image.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render baseline JPEG
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image

          cairosvg.svg2png(
              url='assets/og-image.svg',
              write_to='/tmp/og-image.png',
              output_width=1200,
              output_height=630,
          )
          with Image.open('/tmp/og-image.png') as source:
              source.convert('RGB').save(
                  'assets/og-image.jpg',
                  format='JPEG',
                  quality=90,
                  progressive=False,
                  optimize=False,
                  subsampling=2,
              )

          with Image.open('assets/og-image.jpg') as check:
              assert check.size == (1200, 630)
              check.verify()
          PY
      - name: Commit rebuilt image
        run: |
          if git diff --quiet -- assets/og-image.jpg; then
            echo 'Preview image already matches.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/og-image.jpg
          git commit -m 'Rebuild social preview as baseline JPEG'
          git push
