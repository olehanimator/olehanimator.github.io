name: Rebuild social preview PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-og-png.yml'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          pip install cairosvg pillow

      - name: Render verified PNG
        run: |
          python - <<'PY'
          import cairosvg
          from PIL import Image

          cairosvg.svg2png(
              url='assets/og-image.svg',
              write_to='assets/og-image-v2.png',
              output_width=1200,
              output_height=630,
          )

          with Image.open('assets/og-image-v2.png') as im:
              im.load()
              assert im.size == (1200, 630), im.size
              assert im.format == 'PNG', im.format
              if im.mode not in ('RGB', 'RGBA'):
                  im = im.convert('RGB')
              im.save('assets/og-image-v2.png', format='PNG', optimize=True)

          with Image.open('assets/og-image-v2.png') as check:
              check.verify()
          PY

      - name: Point social metadata at the new PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('https://olehanimator.github.io/assets/og-image.jpg?v=20260809-3', 'https://olehanimator.github.io/assets/og-image-v2.png')
          s = s.replace('<meta property="og:image:type" content="image/jpeg">', '<meta property="og:image:type" content="image/png">')
          p.write_text(s)
          PY

      - name: Verify image metadata
        run: |
          grep -F 'og-image-v2.png' index.html
          grep -F 'content="image/png"' index.html

      - name: Commit corrected preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/og-image-v2.png index.html
          git commit -m 'Use PNG social preview' || exit 0
          git push
