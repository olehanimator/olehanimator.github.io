<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Curriculum Vitae of Oleh Lytvynenko — 3D Artist & Technical Artist.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://olehanimator.github.io/cv.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>CV — Oleh Lytvynenko</title>
  <link rel="stylesheet" href="cv.css?v=20260816-1">
</head>
<body>
  <header class="cv-bar">
    <a class="back-link" id="cvBack" href="index.html" aria-label="Back to portfolio">← <span>Back</span></a>
    <div class="cv-title">
      <strong id="cvTitle">Curriculum Vitae</strong>
      <span>Oleh Lytvynenko</span>
    </div>
    <a class="download-link" id="cvDownload" href="assets/cv.pdf" download="Oleh_Lytvynenko_CV.pdf">
      <svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 4v9"></path>
        <path d="M8.5 10.5 12 14l3.5-3.5"></path>
        <path d="M5 18.5h14"></path>
      </svg>
      <span id="cvDownloadText">Download PDF</span>
    </a>
  </header>

  <main class="viewer-shell" id="viewerShell">
    <div class="pdf-pages" id="pdfPages" aria-label="CV PDF viewer"></div>
    <div class="viewer-status" id="viewerStatus">Loading CV…</div>
  </main>

  <script>
    (() => {
      const texts = {
        en: { back:'Back', backAria:'Back to portfolio', title:'Curriculum Vitae', download:'Download PDF', viewerAria:'CV PDF viewer', loading:'Loading CV…', rendering:'Rendering CV…', error:'Could not load CV.', open:'Open PDF' },
        de: { back:'Zurück', backAria:'Zurück zum Portfolio', title:'Lebenslauf', download:'PDF herunterladen', viewerAria:'CV PDF-Ansicht', loading:'CV wird geladen…', rendering:'CV wird dargestellt…', error:'CV konnte nicht geladen werden.', open:'PDF öffnen' },
        uk: { back:'Назад', backAria:'Назад до портфоліо', title:'Резюме', download:'Завантажити PDF', viewerAria:'Перегляд CV у PDF', loading:'CV завантажується…', rendering:'CV відображається…', error:'Не вдалося завантажити CV.', open:'Відкрити PDF' }
      };
      const saved = localStorage.getItem('portfolio-language');
      const browser = (navigator.language || 'en').slice(0,2);
      const lang = texts[saved] ? saved : (texts[browser] ? browser : 'en');
      const t = texts[lang];
      window.CV_TEXT = t;
      document.documentElement.lang = lang;
      document.getElementById('cvBack').querySelector('span').textContent = t.back;
      document.getElementById('cvBack').setAttribute('aria-label', t.backAria);
      document.getElementById('cvTitle').textContent = t.title;
      document.getElementById('cvDownloadText').textContent = t.download;
      document.getElementById('pdfPages').setAttribute('aria-label', t.viewerAria);
      document.getElementById('viewerStatus').textContent = t.loading;
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="cv.js?v=20260808-4"></script>
</body>
</html>
